services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${BOT_MEMORY_LIMIT:-320m}
    cpus: "${BOT_CPUS:-0.75}"
    environment:
      BOT_ENABLED: ${BOT_ENABLED:-false}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      LEVEL_BOT_API_BASE_URL: ${LEVEL_BOT_API_BASE_URL:-}
      LEVEL_BOT_API_TOKEN: ${LEVEL_BOT_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EXTERNAL_API_KEY:
      CORS_ORIGINS:
    command:
      [
        "sh",
        "-c",
        'if [ "$${BOT_ENABLED}" != "true" ]; then echo "bot disabled; enable after level-bot Cafe API is ready"; sleep infinity; fi; ./scripts/start-bot.sh',
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ "$${BOT_ENABLED}" != "true" ]; then exit 0; fi; test -f "$${BOT_READINESS_FILE:-/tmp/cafe-collection-bot.ready}"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-192m}
    cpus: "${API_CPUS:-0.50}"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LEVEL_BOT_API_BASE_URL: ${LEVEL_BOT_API_BASE_URL:-}
      LEVEL_BOT_API_TOKEN:
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://chill-cafe.site}
    command: ["./scripts/start-api.sh"]
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
