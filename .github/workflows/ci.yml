name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        run: python -m pip install uv==0.11.8

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check src scripts

      - name: Ruff format check
        run: uv run ruff format --check src scripts

      - name: Mypy
        run: uv run mypy src

      - name: Validate Compose files
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.coolify.yml config >/dev/null

      - name: Validate Compose secret scope
        run: uv run python scripts/check_compose_env_scope.py

      - name: Validate Cafe image manifest
        run: uv run python scripts/cafe_asset_manifest.py src/cafe_collection/assets

      - name: Pytest
        run: uv run pytest -q
