[project]
name = "cafe-collection-bot"
version = "0.1.0"
description = "Discord bot for the Cafe Collection feature"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "discord.py~=2.6.0",
    "pydantic-settings~=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy~=1.8",
    "pytest~=8.0",
    "pytest-asyncio~=0.23",
    "ruff~=0.14.0",
]

[project.scripts]
cafe-collection-bot = "cafe_collection.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cafe_collection"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
